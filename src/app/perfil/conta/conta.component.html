<div class="conta-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2 class="sidebar-title">Minha Conta</h2>
    <nav class="sidebar-nav">
      <button
        class="nav-item"
        [class.active]="sectionAtiva === 'dados'"
        (click)="selecionarSecao('dados')">
        Meus Dados
      </button>

      <button
        class="nav-item"
        [class.active]="sectionAtiva === 'endereco'"
        (click)="selecionarSecao('endereco')">
        Meu Endereço
      </button>

      <button
        class="nav-item"
        [class.active]="sectionAtiva === 'curriculo'"
        (click)="selecionarSecao('curriculo')">
        Meu Currículo
      </button>
    </nav>
  </aside>

  <!-- Área de conteúdo -->
  <main class="content-area">
    <div id="content-wrapper">
      <ng-container [ngSwitch]="sectionAtiva">
        <app-meus-dados *ngSwitchCase="'dados'"></app-meus-dados>
        <app-endereco *ngSwitchCase="'endereco'"></app-endereco>
        <app-curriculo *ngSwitchCase="'curriculo'"></app-curriculo>
      </ng-container>
    </div>
  </main>
</div>

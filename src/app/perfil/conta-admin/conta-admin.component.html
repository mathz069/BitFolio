<div class="conta-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2 class="sidebar-title">Minha Conta</h2>
    <nav class="sidebar-nav">
      <button
        class="nav-item"
        [class.active]="sectionAtiva === 'dados'"
        (click)="selecionarSecao('dados')">
        Meus Dados
      </button>

      <button
        class="nav-item"
        [class.active]="sectionAtiva === 'empresas'"
        (click)="selecionarSecao('empresas')">
        Gerenciar Empresas
      </button>

     
    </nav>
  </aside>

  <!-- Área de conteúdo -->
  <main class="content-area">
    <div id="content-wrapper">
      <ng-container [ngSwitch]="sectionAtiva">
        <app-dados-admin *ngSwitchCase="'dados'"></app-dados-admin>
        <app-gerenciar-empresa *ngSwitchCase="'empresas'"></app-gerenciar-empresa>
      </ng-container>
    </div>
  </main>
</div>

<div class="modal-wrapper">

  <!-- HEADER -->
  <div class="modal-header">
    <h2>Cadastro de Empresa</h2>
    <button class="btn-close" (click)="fechar()">×</button>
  </div>

  <!-- BODY -->
  <div class="modal-body">

    <!-- STEP 1 - Empresa -->
    <form [formGroup]="empresaForm" *ngIf="step === 1" (keydown.enter)="nextStep()">

      <div class="input-wrapper">
        <label>Nome *</label>
        <input type="text" formControlName="nome" required />
      </div>

      <div class="input-wrapper">
        <label>Razão Social *</label>
        <input type="text" formControlName="razaoSocial" required />
      </div>

      <div class="input-wrapper">
        <label>CNPJ *</label>
        <input type="text" formControlName="cnpj" mask="00.000.000/0000-00" required />
      </div>

      <div class="input-wrapper">
        <label>Email *</label>
        <input type="text" formControlName="email" required />
      </div>

      <div class="input-wrapper">
        <label>Descrição</label>
        <textarea formControlName="descricao" rows="2"></textarea>
      </div>

    </form>

    <!-- STEP 2 - Endereço -->
    <form [formGroup]="enderecoForm" *ngIf="step === 2" (keydown.enter)="submit()">

      <div class="form-row">
        <div class="input-wrapper">
          <label>CEP *</label>
          <input type="text" formControlName="cep" mask="00000-000" required (blur)="buscarCep()" />
        </div>

        <div class="input-wrapper">
          <label>Estado *</label>
          <input type="text" formControlName="estado" required />
        </div>
      </div>
      <div class="form-row">
        <div class="input-wrapper">
          <label>Cidade *</label>
          <input type="text" formControlName="cidade" required />
        </div>

        <div class="input-wrapper">
          <label>Bairro *</label>
          <input type="text" formControlName="bairro" required />
        </div>

      </div>
      <div class="input-wrapper">
        <label>Rua *</label>
        <input type="text" formControlName="rua" required />
      </div>
      <div class="form-row">
        <div class="input-wrapper">
          <label>Número *</label>
          <input type="text" formControlName="numero" required />
        </div>
      </div>
      <div class="input-wrapper">
        <label>Complemento</label>
        <input type="text" formControlName="complemento" />
      </div>
    </form>

  </div>

</div>

<!-- FOOTER -->
<div class="modal-footer">

  <button class="btn-cancelar" (click)="fechar()">Cancelar</button>

  <button *ngIf="step === 1" class="btn-salvar" [disabled]="empresaForm.invalid" (click)="nextStep()">
    Próximo
  </button>

  <button *ngIf="step === 2" class="btn-salvar" [disabled]="enderecoForm.invalid" (click)="submit()">
    Cadastrar
  </button>

  <button *ngIf="step === 2" class="btn-cancelar" (click)="previousStep()">
    Voltar
  </button>

</div>
